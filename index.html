<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>십이지신 대경주</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e2412f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="대경주">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/i180.png">
<link rel="icon" type="image/png" href="icons/i192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 시끌벅적한 동네 운동회 내기판, 웃기고 빠르게
   IDEA: 운동회 계주 트랙과 응원 현수막
   PICTURE: 흙 트랙 위를 달리는 눈알 굴러가는 십이지신
   COLOUR and TYPE: 잔디 초록 바탕, 흙 주황 트랙, 현수막 빨강+노랑 / Jua
   LAYOUT: 얇은 현수막 제목 아래 한 열 패널, 경주는 한 화면 트랙 */
:root{--bg:#2f8f4e;--deep:#1f6b38;--panel:#fffaf0;--ink:#2a1d12;--red:#e2412f;--yel:#ffc62b;--line:#e5d5b5;color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:repeating-linear-gradient(90deg,#2f8f4e 0 60px,#2b874a 60px 120px);color:var(--ink);font:17px/1.5 Jua,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;min-height:100vh;overflow-x:clip}
header{background:var(--red);color:#fff;text-align:center;padding:10px 12px 14px;position:relative;box-shadow:0 5px 0 #9b2416}
header::after{content:"";position:absolute;left:0;right:0;bottom:-19px;height:14px;background:repeating-linear-gradient(90deg,var(--yel) 0 20px,transparent 20px 40px);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
h1{margin:0;font-size:clamp(30px,5vw,48px);line-height:1.05;font-weight:400;text-shadow:0 3px 0 #9b2416;text-wrap:balance}
header p{margin:2px 0 0;font-size:15px;opacity:.95}
.screen{display:none;max-width:1240px;margin:0 auto;padding:30px max(3vw,12px) 40px}
.screen.on{display:block}
.card{background:var(--panel);border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:0 6px 0 rgba(0,0,0,.25);margin-bottom:18px}
h2{margin:0 0 10px;font-size:26px;font-weight:400;line-height:1.1}
.hint{color:#7a6650;font-size:15px;margin:0 0 12px}
button{font:inherit;font-size:17px;min-height:44px;border:0;border-radius:14px;padding:8px 18px;cursor:pointer;background:var(--yel);color:var(--ink);box-shadow:0 4px 0 #b3830f;transition:transform .05s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b3830f}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.red{background:var(--red);color:#fff;box-shadow:0 4px 0 #9b2416}
button.ghost{background:#efe3cc;box-shadow:0 4px 0 #c9b48e}
button.big{font-size:22px;padding:10px 28px}
button:focus-visible,input:focus-visible{outline:3px solid #1a6dff;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stepper{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.stepper button{width:52px;font-size:26px;padding:0}
.count{font-size:56px;line-height:1;min-width:2.2ch;text-align:center}
.quick button{min-width:44px;padding:6px 10px;font-size:16px}
.quick button.on{background:var(--red);color:#fff;box-shadow:0 4px 0 #9b2416}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:6px}
.names label{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 10px}
.dot{flex:none;width:28px;height:28px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:15px}
.names input{font:inherit;font-size:17px;border:0;width:100%;background:transparent;min-height:38px;outline:none;color:var(--ink)}
.turn{font-size:clamp(26px,4vw,40px);line-height:1.1;margin:0}
.turnsub{color:#7a6650;margin:4px 0 14px}
.animals{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.ani{position:relative;background:#fff;border:3px solid var(--line);border-radius:18px;padding:6px 4px 8px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:0;min-height:150px}
.ani:hover:not(:disabled){border-color:var(--red)}
.ani canvas{width:120px;height:100px;pointer-events:none}
.ani .an{font-size:19px;line-height:1.1}
.ani.taken{background:#f1ebe0;opacity:.75}
.ani .owner{position:absolute;top:6px;left:6px;right:6px;color:#fff;border-radius:10px;padding:0 6px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:2px 12px 2px 4px;font-size:15px}
.chip.now{border-color:var(--red);background:#ffe9e5}
.chip i{width:20px;height:20px;border-radius:50%;display:inline-block}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;color:#fff;margin-bottom:8px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.timer{font-size:30px;line-height:1;min-width:4.5em;font-variant-numeric:tabular-nums}
#lead{font-size:18px}
#log{flex:1 1 220px;font-size:16px;background:rgba(0,0,0,.25);border-radius:12px;padding:6px 12px;min-height:36px}
.racewrap{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.3);background:#cf7b3e}
#rc{display:block;width:100%}
.under{margin-top:14px;justify-content:flex-end}
#setBtn{position:absolute;right:max(12px,2vw);top:50%;transform:translateY(-50%);min-height:40px;padding:4px 14px;font-size:16px}
#setBtn:active{transform:translateY(calc(-50% + 3px))}
@media(max-width:600px){#setBtn{top:auto;bottom:12px;transform:none}header{padding-bottom:58px}}
#set{position:fixed;inset:0;background:rgba(20,12,4,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:6}
#set.on{display:flex}
#set .card{width:min(760px,100%);max-height:calc(100vh - 28px);overflow:auto;margin:0}
#res{position:fixed;inset:0;background:rgba(20,12,4,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:5}
#res.on{display:flex}
#res .card{width:min(560px,100%);max-height:calc(100vh - 28px);overflow:auto;margin:0}
#res.two .card{width:min(900px,100%)}
#res.two #rlist{grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
#res.two #rlist .rr:first-child{grid-column:1/-1}
.win{font-size:clamp(28px,5vw,40px);line-height:1.1;text-align:center;margin:0 0 4px}
#rsub{text-align:center}
#rlist{list-style:none;margin:10px 0 16px;padding:0;display:grid;gap:6px}
.rr{display:grid;grid-template-columns:42px 56px minmax(0,1fr) auto;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 10px}
.rr canvas{width:56px;height:48px}
.rk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e6dccb;font-size:18px;font-weight:400}
.g1 .rk{background:#ffc62b}.g2 .rk{background:#cfd6de}.g3 .rk{background:#e2a36b}
.g1{border-color:#ffc62b;background:#fff7d6}
.rr .nm{font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr small{color:#7a6650;font-size:14px;margin-left:6px}
.rr .tm{font-variant-numeric:tabular-nums;white-space:nowrap;color:#5a4a38}
.rr em{grid-column:3/5;font-style:normal;color:var(--red);font-size:14px;margin-top:-6px}
.last{border-color:var(--red)}
#mute{min-width:44px;padding:6px 12px}
@media(max-width:600px){.stepper .count{font-size:46px}.hud .timer{font-size:24px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<header><h1>십이지신 대경주</h1><p>친구들과 한 판! 2~12명 · 매 판 속도 랜덤 · 중간 지점 돌발 이벤트</p><button class="ghost" id="setBtn" aria-haspopup="dialog">설정</button></header>

<section class="screen on" id="s-setup">
  <div class="card">
    <h2>몇 명이 달릴까요?</h2>
    <div class="stepper">
      <button class="ghost" id="minus" aria-label="한 명 줄이기">−</button>
      <span class="count" id="cnt">6</span>
      <button class="ghost" id="plus" aria-label="한 명 늘리기">+</button>
      <span>명</span>
    </div>
    <div class="row quick" id="quick"></div>
  </div>
  <div class="card">
    <h2>참가자 이름</h2>
    <p class="hint">비워두면 1번, 2번처럼 번호로 불러요. 이름은 이 브라우저에 기억돼요.</p>
    <div class="names" id="names"></div>
    <p class="hint" id="curset" style="margin:16px 0 0"></p>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <button class="ghost" id="clearNames">이름 모두 지우기</button>
      <button class="red big" id="toPick">동물 고르러 가기</button>
    </div>
  </div>
</section>

<div id="set" role="dialog" aria-modal="true" aria-labelledby="settitle">
  <div class="card">
    <h2 id="settitle">설정</h2>
    <h2 style="font-size:21px;margin-top:14px">맵</h2>
    <p class="hint">맵마다 깔리는 함정이 달라요.</p>
    <div class="row quick" id="mapsel"></div>
    <h2 style="font-size:21px;margin-top:22px">중간 이벤트</h2>
    <p class="hint">랜덤이면 매 판 룰렛으로 정해지고, 하나를 고르면 룰렛 없이 바로 그 이벤트가 나와요.</p>
    <div class="row quick" id="evsel"></div>
    <p class="hint" style="margin-top:18px">바꾼 설정은 자동 저장되고, 다음 경주부터 적용돼요.</p>
    <div class="row" style="justify-content:flex-end"><button class="red" id="setClose">닫기</button></div>
  </div>
</div>

<section class="screen" id="s-pick">
  <div class="card">
    <p class="turn" id="turn"></p>
    <p class="turnsub" id="turnSub"></p>
    <div class="animals" id="animals"></div>
    <div class="chips" id="chips"></div>
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <button class="ghost" id="back">← 인원 설정</button>
        <button class="ghost" id="undo">한 칸 되돌리기</button>
        <button class="ghost" id="shuf">고르는 순서 섞기</button>
        <button id="rest">남은 사람 랜덤 배정</button>
      </div>
      <button class="red big" id="go">경주 시작!</button>
    </div>
  </div>
</section>

<section class="screen" id="s-race">
  <div class="hud">
    <span class="timer" id="tm">0.00초</span>
    <span id="lead"></span>
    <span id="log">곧 출발합니다!</span>
    <button class="ghost" id="mute" aria-label="소리 켜고 끄기">소리 켬</button>
  </div>
  <div class="racewrap" id="wrap"><canvas id="rc"></canvas></div>
  <div class="row under">
    <button class="ghost" id="quit">그만하고 동물 다시 고르기</button>
    <button id="again0">처음부터 다시 달리기</button>
  </div>
</section>

<div id="res" role="dialog" aria-modal="true" aria-labelledby="wtitle">
  <div class="card">
    <p class="win" id="wtitle"></p>
    <p class="hint" id="rsub"></p>
    <ol id="rlist"></ol>
    <div class="row" style="justify-content:center">
      <button class="red big" id="again">같은 동물로 한 판 더</button>
      <button class="ghost" id="repick">동물 다시 고르기</button>
      <button class="ghost" id="home">처음으로</button>
    </div>
  </div>
</div>

<script>
{
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const LANEC=['#e2412f','#1f6fe0','#d99000','#2fa84f','#8b4fd6','#e0509c','#119c9c','#f06a12','#55657a','#a0522d','#3949ab','#689f38'];
const L='#2a1d12';
const AN=[
 {k:'rat',n:'쥐',c:'#a4a9b3',b:'#e4e6ea',d:'#7d838e',ear:'round',legs:4,tail:'rat'},
 {k:'ox',n:'소',c:'#c98236',b:'#e3ad6c',d:'#9c5d22',ft:'#3a2a1e',ear:'side',legs:4,tail:'tuft'},
 {k:'tiger',n:'호랑이',c:'#f29a2e',b:'#fff4e0',d:'#cf7a16',ear:'round',legs:4,tail:'tuft'},
 {k:'rabbit',n:'토끼',c:'#ffffff',b:'#ffe3ea',d:'#e6d9dc',ear:'long',legs:4,tail:'puff'},
 {k:'dragon',n:'용',c:'#3fae5a',b:'#f1e27a',d:'#2c8a43',ear:'none',legs:4,tail:'dragon'},
 {k:'snake',n:'뱀',c:'#86c44a',b:'#d9ef8a',d:'#5d9a2c',ear:'none',legs:0,tail:'none'},
 {k:'horse',n:'말',c:'#b0703c',b:'#d9a170',d:'#8a5428',ft:'#3a2a1e',ear:'point',legs:4,tail:'horse'},
 {k:'sheep',n:'양',c:'#ffffff',b:'#ffffff',d:'#3e3434',h:'#5a4d4b',lg:'#5a4d4b',ft:'#2a2222',ear:'side',legs:4,tail:'puff'},
 {k:'monkey',n:'원숭이',c:'#93603a',b:'#f2cd9c',d:'#6e4426',ear:'side',legs:4,tail:'curl'},
 {k:'rooster',n:'닭',c:'#ffffff',b:'#ffffff',d:'#e6dccb',ear:'none',legs:2,tail:'none'},
 {k:'dog',n:'개',c:'#e0aa62',b:'#fbe6c4',d:'#9a6630',ear:'flop',legs:4,tail:'tuft'},
 {k:'pig',n:'돼지',c:'#f8aebd',b:'#fcd2da',d:'#e98aa0',ft:'#b8607a',ear:'point',legs:4,tail:'pig'}
];
const INC=[
 {k:'cramp',t:'다리에 쥐났다!!',d:1.3,m:0},
 {k:'fall',t:'꽈당!',d:1.0,m:0},
 {k:'boost',t:'부스터 온!',d:1.3,m:2.1},
 {k:'sleep',t:'졸려… zZ',d:1.5,m:.25},
 {k:'fart',t:'뿡! 방귀 부스트',d:1.0,m:2.4},
 {k:'back',t:'어? 반대로?!',d:.8,m:-.5},
 {k:'shoe',t:'신발 벗겨짐!',d:1.2,m:.45},
 {k:'cheer',t:'관중 함성에 힘이 불끈!',d:1.2,m:1.6}
];
/* 맵: items=깔리는 함정 종류, lane=레인 2색, line=레인 구분선, sky=하늘 2색, bot=트랙 아래, deco=하늘 장식, dust=흙먼지 색 */
const MAPS=[
 {n:'운동장',d:'덫·바나나·얼음 모두',items:['trap','banana','ice'],lane:['#cc783b','#d6864a'],line:'rgba(255,255,255,.55)',sky:['#5bbcff','#c4ebff'],bot:'#2f8f4e',deco:'flags',dust:'rgba(255,235,200,.7)'},
 {n:'빙하',d:'얼음만 나와요',items:['ice'],lane:['#79b4d3','#88c0dc'],line:'rgba(255,255,255,.8)',sky:['#9fc9e8','#eaf6ff'],bot:'#f4fbff',deco:'snow',dust:'rgba(255,255,255,.9)'},
 {n:'정글',d:'바나나만 나와요',items:['banana'],lane:['#4f7f2f','#5a8c37'],line:'rgba(20,50,10,.45)',sky:['#2f7a3a','#9bd16a'],bot:'#2b5a22',deco:'leaves',dust:'rgba(190,220,140,.7)'},
 {n:'도시',d:'덫만 나와요',items:['trap'],lane:['#4a4e55','#53575e'],line:'rgba(255,214,0,.75)',sky:['#2d3b63','#f6a96b'],bot:'#33363b',deco:'city',dust:'rgba(200,200,200,.6)'}
];
const BOOSTS=INC.filter(x=>x.m>1),NEG=INC.filter(x=>['cramp','fall','back'].includes(x.k));
/* 중간 이벤트 이후: 돌발 상황 1.4배 자주, 부스터가 아닌 경우 60%는 쥐남·꽈당·역주행 */
const AFTER={rate:1.4,neg:.6};
/* 순위 구간별 돌발 상황: rate=초당 발동 확률, pb=부스터 종류만 뽑힐 확률(나머지는 전체 중 균등), cd=다음까지 쿨타임 */
const TIER={top:{rate:.8,pb:0,cd:[2.5,6]},low:{rate:1.4,pb:.65,cd:[1.6,3.5]},last:{rate:2.2,pb:.85,cd:[.9,2]}};
const EVS=[
 {n:'위치 대혼란!',d:'모두 위치가 조금씩 앞뒤로 바뀝니다'},
 {n:'출발 ↔ 도착 체인지!',d:'결승선이 출발선으로! 반대로 달려라'},
 {n:'꼴찌들의 역습!',d:'하위권에게 가속 부스터 발동'},
 {n:'함정 설치!',d:'덫 · 바나나 · 얼음이 트랙에 깔렸다!'},
 {n:'한 명만 출발선으로!',d:'누군가 혼자 처음부터 다시!'}
];
/* 함정: 밟으면 순서대로 효과 적용 (가속 중이어도 무조건 발동) */
const HZ={trap:[{k:'trap',m:0,d:1,t:'덫에 걸렸다!'}],
 banana:[{k:'slide',m:2.2,d:1,t:'바나나 미끄덩~'},{k:'fall',m:0,d:2.5,t:'꽈당!!'}],
 ice:[{k:'iceboost',m:2,d:3,t:'얼음 위 쭈욱~'},{k:'frozen',m:0,d:4,t:'추워… 꽁꽁'}]};

/* ---------- drawing ---------- */
function E(c,x,y,rx,ry,f,rot,st){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);c.fillStyle=f;c.fill();if(st!==false)c.stroke()}
function P(c,pts,f){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();c.fillStyle=f;c.fill();c.stroke()}
function leg(c,A,x,y,ang,col){c.save();c.translate(x,y);c.rotate(ang);c.beginPath();c.roundRect(-5,0,10,20,4);c.fillStyle=col;c.fill();c.stroke();E(c,2,20,7,4.5,A.ft||A.d);c.restore()}
function tail(c,A,sw,t){
 c.save();
 if(A.tail==='rat'){c.lineWidth=3.2;c.strokeStyle='#e88fa3';c.beginPath();c.moveTo(-32,-32);c.bezierCurveTo(-48,-18+sw*6,-56,-46,-66,-36+sw*4);c.stroke()}
